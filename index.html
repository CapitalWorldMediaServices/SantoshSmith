<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5b12df">
  <meta name="description" content="Santosh Smith — Capital Group digital business card.">
  <title>Santosh Smith | Capital Group</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #080808; }
    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100% - 28px, 760px);
      margin: 0 auto;
      padding: 22px 0 36px;
    }
    .card-image {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 720 / 424;
      object-fit: contain;
      border-radius: 5.3%;
      box-shadow: 0 18px 35px #0008;
      margin: 0 auto 20px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 22px;
    }
    .actions a, .actions button {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: white;
      background: #5b12df;
      border: 1px solid #532a92;
      border-radius: 12px;
      padding: 15px 12px;
      font: 700 16px Arial, Helvetica, sans-serif;
      cursor: pointer;
    }
    .actions .secondary {
      background: #202020;
      border-color: #393939;
    }
    .note {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin: 18px 0 0;
    }
    @media (min-width: 620px) {
      main { padding-top: 34px; }
      .actions { grid-template-columns: 1fr 1fr; }
      .actions > :first-child { grid-column: span 2; }
    }
  </style>
</head>
<body>
  <main>
    <!-- Original Capital Group artwork supplied for Santosh Smith. Keep both PNG files beside index.html. -->
    <img class="card-image" src="capital-card-front.png" alt="Capital Group business card front">
    <img class="card-image" src="capital-card-back.png" alt="Capital Group business card back — Santosh Smith">

    <nav class="actions" aria-label="Contact actions">
      <a href="tel:+917738331222">Call Santosh</a>
      <a class="secondary" href="mailto:santosh@capitalgroup.me">Email Santosh</a>
      <a class="secondary" href="https://capitalgroup.me" target="_blank" rel="noopener">Visit Website</a>
      <a class="secondary" href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0AVERSION%3A3.0%0AN%3ASMITH%3BSANTOSH%3B%3B%3B%0AFN%3ASantosh%20Smith%0AORG%3ACapital%20Group%0ATITLE%3AManaging%20Director%0ATEL%3BTYPE%3DCELL%3A%2B917738331222%0AEMAIL%3Asantosh%40capitalgroup.me%0AURL%3Ahttps%3A%2F%2Fcapitalgroup.me%0AEND%3AVCARD" download="Santosh_Smith.vcf">Save Contact</a>
      <button class="secondary" type="button" id="shareCard">Share My Card</button>
    </nav>
    <p class="note">● Tap to connect · Keep in touch</p>
  </main>
  <script>
    document.getElementById("shareCard").addEventListener("click", async () => {
      const shareData = {
        title: "Santosh Smith | Capital Group",
        text: "Santosh Smith — Capital Group digital business card",
        url: window.location.href
      };
      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(window.location.href);
          alert("Card link copied.");
        } else {
          prompt("Copy your card link:", window.location.href);
        }
      } catch (error) {
        if (error.name !== "AbortError") alert("Unable to share automatically. Copy the page URL from your browser.");
      }
    });
  </script>
</body>
</html>
